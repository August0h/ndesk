name: Build and Push Custom Image

on:
  push:
    branches: [newbyte-stable]
    tags: ['nb.*']

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine image tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            # Closed format. A git refname may legally contain $ ; & | ' " and
            # this value reaches a remote shell in the deploy job.
            if [[ ! "$tag" =~ ^nb\.v[0-9]+(\.[0-9]+)*$ ]]; then
              echo "refusing tag '$tag': expected nb.vN[.N...]" >&2
              exit 1
            fi
            echo "tag=$tag" >> $GITHUB_OUTPUT
          else
            echo "tag=sha-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi

      - name: Stamp version with nb tag
        run: |
          base_version=$(cat VERSION | tr -d '[:space:]')
          echo "${base_version}-${{ steps.tag.outputs.tag }}" > VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: COMMIT_SHA=${{ github.sha }}
          push: true
          tags: |
            technewbyte/ndesk:${{ steps.tag.outputs.tag }}
            technewbyte/ndesk:latest

  deploy:
    runs-on: ubuntu-24.04
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
    # Stops two tags overlapping. It does NOT order them -- GitHub queues by
    # arrival at the group, not by trigger time -- so the script also refuses to
    # move the release backwards.
    #
    # Known limit: only ONE job stays pending, and a newly queued one CANCELS
    # the pending predecessor. With three tags in flight the newest can be the
    # one cancelled -- a grey job, not a red one -- and an older tag then lands
    # and is accepted, because it is still newer than what is deployed. Nothing
    # here notices. A cancelled deploy therefore means "re-run the newest tag",
    # and until the queue preserves every pending job that is a manual step.
    concurrency:
      group: ndesk-deploy
      cancel-in-progress: false
    steps:
      # An absent secret renders as an empty string, and an empty `fingerprint`
      # makes the action fall back to InsecureIgnoreHostKey -- it would accept
      # any server answering at that address, with no error. Fail closed here
      # instead of depending on someone remembering to create the secret.
      - name: Require the host fingerprint
        env:
          FINGERPRINT: ${{ secrets.NDESK_SSH_FINGERPRINT }}
        run: |
          test -n "$FINGERPRINT" || {
            echo "NDESK_SSH_FINGERPRINT is not set." >&2
            echo "Refusing to deploy without host key verification." >&2
            exit 1
          }

      - name: Deploy to prod-ndesk
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
        with:
          host: ${{ secrets.NDESK_HOST }}
          port: ${{ secrets.NDESK_SSH_PORT }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Without this the action falls back to InsecureIgnoreHostKey: the job
          # would authenticate to ANY server answering at that address, so a
          # redirected connection could fabricate a green deploy.
          #
          # The full `SHA256:...` string, obtained out of band, for the key type
          # the Go client actually negotiates -- which is RSA, not ED25519: Go's
          # default host key algorithms put rsa-sha2-256/512 ahead of
          # ssh-ed25519. Derive it with:
          #   ssh-keyscan -t rsa -p <port> <host> | ssh-keygen -lf - | awk '{print $2}'
          # If a deploy ever fails with a fingerprint mismatch, re-derive it the
          # same way rather than guessing the key type.
          fingerprint: ${{ secrets.NDESK_SSH_FINGERPRINT }}
          # The only bounded wait inside the script is the 60s flock. The
          # migrations are deliberately NOT wrapped in `timeout` (killing the
          # compose client mid-migration would orphan it), so THIS is what
          # bounds them -- plus two pulls, the stop and the recreate. A hung
          # migration ends here, red, with the app tier still down.
          command_timeout: 30m
          # drone-ssh emits these as single-quoted, escaped `export` lines ahead
          # of the script, so the values never splice into the script body.
          envs: IMAGE_TAG,IMAGE_DIGEST
          script: |
            # appleboy/ssh-action@v1 dropped script_stop, so without this a
            # failing pull or up -d still reports a green job.
            set -Eeuo pipefail
            cd /opt/zammad

            IMAGE_NAME=technewbyte/ndesk
            expr "$IMAGE_TAG" : 'nb\.v[0-9][0-9.]*$' >/dev/null \
              || { echo "refusing tag: $IMAGE_TAG" >&2; exit 1; }
            expr "$IMAGE_DIGEST" : 'sha256:[0-9a-f]\{64\}$' >/dev/null \
              || { echo "bad digest: $IMAGE_DIGEST" >&2; exit 1; }
            REF="${IMAGE_TAG}@${IMAGE_DIGEST}"

            # Functions, not strings: an unquoted "$COMPOSE" would rely on word
            # splitting, which shellcheck flags and which breaks the moment a path
            # gains a space. The -f list is shared, and is the SAME list the infra
            # playbooks use -- a mismatch would mean the two disagree about what the
            # stack is.
            COMPOSE_FILES=(-f docker-compose.yml
                           -f scenarios/add-cloudflare-tunnel.yml
                           -f scenarios/apply-resource-limits.yml)
            compose() {
              docker compose --env-file .env --env-file .env.release \
                "${COMPOSE_FILES[@]}" "$@"
            }
            # Same, minus .env.release. Used ONLY by the read-only gates below, which
            # run BEFORE that file is written -- on a freshly rebuilt host it may not
            # exist yet, and --env-file on a missing file is an error. Container state
            # and the database credentials do not depend on it.
            compose_pre() {
              docker compose --env-file .env "${COMPOSE_FILES[@]}" "$@"
            }

            # In /opt/zammad, not /tmp: world-writable /tmp lets any local user
            # pre-create the file and lock deploys out for good. 60s, not longer:
            # the concurrency group already serialises this job against itself.
            exec 9>.deploy.lock
            # Say so: a bare `flock` failure exits 1 with an empty log, and a
            # red job with no line in it reads like an infrastructure glitch.
            flock -w 60 9 || {
              echo "another deploy holds /opt/zammad/.deploy.lock;" >&2
              echo "waited 60s, gave up. Nothing moved." >&2
              exit 1
            }

            # Two tags pushed close together are serialised but NOT ordered --
            # the later build can finish first, and the older one would then
            # deploy over it. Refuse to go backwards; a deliberate rollback goes
            # through the Ansible path with an explicit reference.
            if [ -f .env.release ]; then
              cur="$(sed -n 's/^VERSION=\(nb\.v[0-9.]*\)@.*/\1/p' .env.release)"
              if [ -z "$cur" ]; then
                # The infra repo's SEED names the image by bare digest, with no
                # nb.vN in it (the infra repo records a digest). So after a DR
                # rebuild there is nothing to compare against and re-running an
                # OLD tag's job would be accepted. Deliberate, and the reason
                # the guard is described as "refuses a release older than the
                # deployed one" only once a CD release has written this file.
                echo "no comparable tag in .env.release (seeded file?);" \
                     "order check SKIPPED"
              elif [ "$cur" != "$IMAGE_TAG" ]; then
                newest="$(printf '%s\n%s\n' "$cur" "$IMAGE_TAG" | sort -V | tail -1)"
                [ "$newest" = "$IMAGE_TAG" ] || {
                  echo "refusing to move the release back: $cur is newer than $IMAGE_TAG" >&2
                  exit 1
                }
              fi
            fi

            # ------------------------------------------------------------------
            # Portoes, TODOS antes de qualquer escrita. Uma recusa daqui para
            # cima nao move nada: nem o .env.release, nem um container.
            # ------------------------------------------------------------------
            running_before="$(compose_pre ps --services --status running | tr '\n' ' ')"

            # Pre-flight. O `run --no-deps` abaixo nao sobe dependencia: com o banco
            # fora, o init falharia DEPOIS de o tier de app estar parado, virando
            # uma recusa em outage. Host frio e o caminho de reconstrucao da
            # infraestrutura, nao este job.
            for req in zammad-railsserver zammad-postgresql; do
              case " $running_before " in
                *" $req "*) ;;
                *) echo "$req is not running: refusing to deploy, nothing moved." >&2
                   echo "A cold host is the infra rebuild path's job, not this one." >&2
                   exit 1 ;;
              esac
            done

            # zammad-init SEMEIA uma instalacao nova contra o banco que encontrar.
            # Com o banco vazio, migrar seria substituir a producao por um helpdesk
            # em branco. Mesmo portao do playbook, lido de dentro do container para
            # nenhuma credencial passar por aqui.
            # shellcheck disable=SC2016
            # As variaveis expandem DENTRO do container, nao aqui -- as aspas
            # simples sao o ponto.
            tickets="$(compose_pre exec -T zammad-postgresql \
              sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT count(*) FROM tickets;"' \
              2>/dev/null | tr -d '[:space:]' || true)"
            case "$tickets" in
              ''|*[!0-9]*)
                echo "could not read a ticket count from the database;" >&2
                echo "refusing to run migrations, nothing moved." >&2
                exit 1 ;;
            esac
            [ "$tickets" -gt 0 ] || {
              echo "the database reports 0 tickets: refusing to run zammad-init," >&2
              echo "which would seed a blank install. Nothing moved." >&2
              exit 1
            }

            # Pull BEFORE writing anything. A pull that fails after the write
            # would leave the file naming a release the host cannot run.
            docker pull "${IMAGE_NAME}:${REF}"

            # The release identity lives in a file this pipeline OWNS. .env is
            # rendered by the infra repo -- it holds secrets and the sidecar
            # pins -- and is never edited from here. Compose merges both env
            # files, last one wins, so these two keys override what .env says.
            umask 022
            printf 'IMAGE_REPO=%s\nVERSION=%s\n' "$IMAGE_NAME" "$REF" > .env.release.tmp
            mv .env.release.tmp .env.release

            compose pull

            # Migrar com o tier de app PARADO. Esta e a mesma sequencia que a
            # infraestrutura usa nas rodadas dela, e a ordem importa nas DUAS
            # direcoes: recriar antes de migrar deixa o codigo NOVO contra o schema
            # ANTIGO pelo tempo das migrations; migrar antes de parar deixa o codigo
            # ANTIGO contra o schema NOVO pelo tempo do recreate. Deploy sem
            # downtime dependeria de as migrations serem compativeis para tras, e
            # ninguem verificou que as do Zammad sao -- entao a janela e alargada de
            # proposito em vez de a gente apostar nisso.
            #
            # `up -d` NAO serve de portao: nada neste stack usa
            # service_completed_successfully, entao ele sobe o railsserver em
            # paralelo com o init.
            #
            # Os servicos de dados ficam de pe (o init precisa do banco) e o tunel
            # tambem: para-lo troca um 502 atras do Cloudflare por um 530 "origin
            # unreachable", que e pior pelo mesmo trabalho.
            #
            # Evite a janela diaria de backup: parar o zammad-backup no meio trunca
            # um dump. O horario esta no repo da frota.
            to_stop=""
            for svc in $running_before; do
              case "$svc" in
                zammad-postgresql|zammad-elasticsearch|zammad-redis|zammad-memcached|cloudflare-tunnel) ;;
                *) to_stop="$to_stop $svc" ;;
              esac
            done
            # shellcheck disable=SC2086
            [ -z "$to_stop" ] || compose stop $to_stop

            # `run --rm`, NAO `up -d`. Tres razoes, cada uma carregando peso:
            #   * zammad-init carrega `restart: on-failure`. Sob `up -d`, um init que
            #     falha reinicia para sempre e qualquer espera nele trava; `run`
            #     trata o container como one-off, entao o exit code e real e chega
            #     uma vez.
            #   * --no-deps: `run` segue depends_on e o init depende do postgres.
            #     Sem isso ele pode SUBIR o banco, furando o portao acima.
            #   * -T: nao ha TTY neste transporte.
            # Sem `timeout` em volta: matar o cliente do compose no meio deixaria a
            # migration rodando sem ninguem lendo como ela terminou. O limite e o
            # command_timeout do job, que falha vermelho.
            initrc=0
            compose run --rm --no-deps -T zammad-init || initrc=$?
            if [ "$initrc" != "0" ]; then
              echo "zammad-init exited ${initrc}: the migrations did NOT complete." >&2
              echo "THE APP TIER IS STOPPED and the schema may be PARTIALLY migrated" >&2
              echo "-- Rails commits one migration at a time, so this is not" >&2
              echo "'nothing happened'. An exit of 137 is SIGKILL, usually the memory" >&2
              echo "cap, and leaves the output empty; read dmesg -T on the host" >&2
              echo "instead of reading anything into the silence." >&2
              echo "TO RESTORE SERVICE, run this on the host:" >&2
              echo "  cd /opt/zammad && docker compose --env-file .env" \
                   "--env-file .env.release -f docker-compose.yml" \
                   "-f scenarios/add-cloudflare-tunnel.yml" \
                   "-f scenarios/apply-resource-limits.yml up -d${to_stop}" >&2
              echo "That brings the app back on the NEW release, which .env.release" >&2
              echo "already names, on a schema that is already partly forward." >&2
              echo "Coming back on the OLD release is the Ansible path." >&2
              exit 1
            fi

            # Recriar EXATAMENTE o que estava rodando, nomeado. Nunca um `up -d`
            # pelado: ele subiria servico que estava parado de proposito -- o
            # zammad-scheduler busca e-mail de cliente, e isso e destrutivo em
            # qualquer lugar que nao seja a producao.
            # --no-deps: naming a service still pulls in its depends_on chain,
            # so a plain `up -d` would start memcached, redis or postgresql if
            # one of them had been stopped on purpose. Every service named here
            # was running a moment ago, and the ones that were never stopped are
            # a no-op.
            # shellcheck disable=SC2086
            compose up -d --no-deps $running_before

            # Prove the containers moved. `up -d` returning 0 is not proof: on
            # 2026-09-10 this job reported success for a release that never
            # shipped, because the pinned reference on disk never changed.
            cid="$(compose ps -q zammad-railsserver | head -1)"
            [ -n "$cid" ] || { echo "zammad-railsserver is not running" >&2; exit 1; }
            got="$(docker inspect --format '{{.Config.Image}}' "$cid")"
            state="$(docker inspect --format '{{.State.Status}}' "$cid")"
            case "$got" in
              *"$IMAGE_DIGEST"*) ;;
              *) echo "expected $REF, container runs $got" >&2; exit 1 ;;
            esac
            [ "$state" = "running" ] || {
              echo "zammad-railsserver is on the right image but ${state}" >&2; exit 1
            }

            # The same assert the infra playbook makes, and for the same reason:
            # this job must never leave a service running that was not running
            # before it started. The scheduler is the expensive one -- Zammad
            # fetches customer mail destructively, so a second poller consumes
            # mail before production ever sees it.
            set_of() { tr ' ' '\n' | sed '/^$/d' | sort | tr '\n' ' '; }
            running_after="$(compose ps --services --status running | tr '\n' ' ')"
            before_set="$(printf '%s' "$running_before" | set_of)"
            after_set="$(printf '%s' "$running_after" | set_of)"
            [ "$before_set" = "$after_set" ] || {
              echo "the running set changed." >&2
              echo "  before: $before_set" >&2
              echo "  after:  $after_set" >&2
              echo "If zammad-scheduler is in 'after' and not in 'before', STOP" >&2
              echo "IT NOW -- a second mail poller eats customer mail." >&2
              exit 1
            }

            # `running` is not `serving`. A release that boots and then dies on
            # its first request reports success from docker's point of view, so
            # ask the app itself. Same endpoint the infra runbooks use; 8080 is
            # the host-local nginx, closed to the world at DOCKER-USER.
            #
            # 3 minutes, not one: the only measured figure on this host is Rails
            # answering 46s after a WARM restart (infra runbook, 2026-09-16
            # reboot window). This path is colder -- migrations ran and every app
            # container was recreated -- so a one-minute ceiling would fail a
            # deploy that is merely still booting.
            code=""
            for _ in $(seq 18); do
              code="$(curl -fsS -o /dev/null -w '%{http_code}' --max-time 10 \
                http://127.0.0.1:8080/api/v1/getting_started || true)"
              if [ "$code" = "200" ]; then break; fi
              sleep 10
            done
            [ "$code" = "200" ] || {
              echo "the app is on the new image but did not answer 200 within" >&2
              echo "3min (last: ${code:-no response}). The release is DEPLOYED and" >&2
              echo "the schema is migrated -- this is a failure to serve, not a" >&2
              echo "failure to deploy. Read the railsserver log on the host." >&2
              exit 1
            }

            echo "deployed: $got (HTTP 200)"
